name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, dan unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --continue
      - name: Simpan laporan lint & test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            media/*/build/reports/
            media/*/build/test-results/
